  <polygon points="102,20 122,40 102,40" fill="var(--ink-muted)" />
  <rect x="57" y="49" width="19" height="15" rx="2" fill="none" stroke="var(--base-900)" stroke-width="3" />
  <rect x="84" y="49" width="19" height="15" rx="2" fill="none" stroke="var(--base-900)" stroke-width="3" />
  <rect x="76" y="54" width="8" height="3" fill="var(--base-900)" />
  <rect class="eye" x="64" y="54" width="5" height="5" fill="var(--base-900)" />
  <rect class="eye" x="91" y="54" width="5" height="5" fill="var(--base-900)" />
  <path d="M71 76 Q80 82 89 76" fill="none" stroke="var(--base-900)" stroke-width="3" stroke-linecap="square" />
  <rect x="66" y="142" width="7" height="12" fill="var(--readout)" />
  <rect x="76.5" y="135" width="7" height="19" fill="var(--readout)" />
  <rect x="87" y="128" width="7" height="26" fill="var(--readout)" />
