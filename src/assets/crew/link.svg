  <circle cx="68" cy="58" r="5.5" fill="none" stroke="var(--base-900)" stroke-width="3" />
  <circle cx="92" cy="58" r="5.5" fill="none" stroke="var(--base-900)" stroke-width="3" />
  <path d="M70 75 Q80 81 90 75" fill="none" stroke="var(--base-900)" stroke-width="3" stroke-linecap="square" />
  <rect x="60" y="134" width="24" height="13" rx="6" fill="none" stroke="var(--readout)" stroke-width="3" />
  <rect x="76" y="134" width="24" height="13" rx="6" fill="none" stroke="var(--readout)" stroke-width="3" />
