<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" fill="var(--base-900)" />
  <!-- shoulders and neck -->
  <path d="M18 160 V142 Q18 124 38 119 L64 112 H96 L122 119 Q142 124 142 142 V160 Z" fill="var(--rule)" />
  <rect x="68" y="100" width="24" height="16" fill="var(--hairline)" />
  <!-- keycap head: sides in rule, face in readout -->
  <rect x="38" y="20" width="84" height="84" rx="6" fill="var(--rule)" />
  <polygon points="38,20 122,20 108,32 52,32" fill="var(--rule)" opacity="0.82" />
  <polygon points="38,104 122,104 108,90 52,90" fill="var(--hairline)" />
  <polygon points="38,20 52,32 52,90 38,104" fill="var(--rule)" opacity="0.66" />
  <polygon points="122,20 108,32 108,90 122,104" fill="var(--rule)" opacity="0.5" />
  <rect x="52" y="32" width="56" height="58" rx="3" fill="var(--readout)" />
  <!-- Drew: a pencil behind the ear, one raised brow, an open collar -->
  <g transform="rotate(28 128 44)">
    <rect x="124" y="14" width="8" height="8" fill="var(--ink-muted)" />
    <rect x="124" y="22" width="8" height="40" fill="var(--readout)" />
    <polygon points="124,62 132,62 128,72" fill="var(--ink-muted)" />
  </g>
  <rect x="62" y="57" width="11" height="4" fill="var(--base-900)" />
  <rect x="87" y="57" width="11" height="4" fill="var(--base-900)" />
  <rect x="86" y="47" width="13" height="3" fill="var(--base-900)" transform="rotate(-10 92 48)" />
  <path d="M69 74 Q83 84 93 71" fill="none" stroke="var(--base-900)" stroke-width="3" stroke-linecap="square" />
  <polygon points="64,112 80,138 96,112" fill="var(--hairline)" />
  <rect x="104" y="130" width="16" height="3" fill="var(--hairline)" />
  <rect x="110" y="122" width="3" height="11" fill="var(--readout)" />
</svg>
